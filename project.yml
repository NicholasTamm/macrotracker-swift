name: MacroFactorClone
options:
  bundleIdPrefix: com.nicholastamm
  deploymentTarget:
    iOS: "17.0"
packages:
  MacroFactorClone:
    path: .
targets:
  MacroFactorClone:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: MacroFactorClone
        product: AppShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholastamm.MacroFactorClone
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/MacroFactorClone.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - DataLayerTests
        - CoachingEngineTests
  DataLayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DataLayerTests
    dependencies:
      - package: MacroFactorClone
        product: DataLayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CoachingEngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CoachingEngineTests
    dependencies:
      - package: MacroFactorClone
        product: CoachingEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
